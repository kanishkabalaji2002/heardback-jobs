name: Refresh jobs

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button

concurrency:
  group: refresh-jobs         # never two runs at once
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kanishkabalaji2002/hearback
          token: ${{ secrets.HEARDBACK_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull jobs into Supabase
        run: node scripts/ingest-jobs.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUIET_LOGS: "1"
